name: Auto Facebook Post

on:
  schedule:
    # GitHub cron UTC te chole. Bangladesh (UTC+6) shomoy:
    - cron: "0 3 * * *"   # shokal 9:00
    - cron: "0 7 * * *"   # dupur 1:00
    - cron: "0 11 * * *"  # bikal 5:00
    - cron: "0 14 * * *"  # rat 8:00
  workflow_dispatch: # hat e test korar jonno

permissions:
  contents: write # posted.json save korar jonno

concurrency:
  group: fb-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Browser ar Bangla/Arabic font
        run: |
          playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-core || true

      - run: python post.py
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          POSTER_FOOTER: ${{ vars.POSTER_FOOTER }}

      - name: Save posted.json (jate repeat na hoy)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posted.json
          if ! git diff --cached --quiet; then
            git commit -m "update posted state"
            git pull --rebase
            git push
          fi
